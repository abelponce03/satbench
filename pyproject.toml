[project]
name = "satbench"
version = "0.1.0"
description = "Reproducible, blocked benchmarking of human-designed vs AI-tuned/AI-generated SAT solvers"
readme = "README.md"
authors = [
    { name = "Abel Ponce González" }
]
requires-python = ">=3.12"
dependencies = [
    "gbdc>=0.4.5",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psutil>=7.2.2",
    "scipy>=1.18.1",
]

[project.scripts]
satbench = "satbench.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Only our own tests. solvers/out holds third-party solver trees (some ship their own Python
# tests); they must never be imported on the host.
testpaths = ["tests"]
norecursedirs = ["solvers", ".venv", "data"]
