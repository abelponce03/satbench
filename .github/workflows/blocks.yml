# Execute one wave of the blocked design on GitHub-hosted runners.
#
# A wave is a file waves/wave-NNN.csv on the `results` branch, written by the orchestrator
# (orchestrator.yml): pending blocks packed into jobs 0..k. Each matrix job = one host:
# host check (design [hosts]), calibration, up to `blocks_per_job` blocks (two solvers in
# parallel, one physical core each), calibration. Results are uploaded as artifacts
# `wave-NNN-job-J`, which the orchestrator ingests into the `results` branch.
#
# Only users with write access (and the orchestrator's token) can dispatch this workflow; inputs
# are passed through environment variables and validated, never interpolated into shell code.
name: blocks
run-name: blocks wave ${{ inputs.wave }} [${{ inputs.results_branch }}]

on:
  workflow_dispatch:
    inputs:
      wave:
        description: "wave number (three digits, e.g. 007)"
        required: true
      image:
        description: "solver image by digest, e.g. ghcr.io/OWNER/satbench-solvers@sha256:..."
        required: true
      max_parallel:
        description: "concurrent jobs of this wave"
        required: true
        default: "10"
      design_file:
        description: "design (study/design.toml; study/design-pilot.toml for tooling pilots)"
        required: true
        default: "study/design.toml"
      results_branch:
        description: "branch holding waves/ and results (results, or results-test for machinery tests)"
        required: true
        default: "results"

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.m.outputs.jobs }}
    steps:
      - name: Validate branch
        env:
          RB: ${{ inputs.results_branch }}
        run: '[[ "$RB" == "results" || "$RB" == "results-test" ]] || { echo "bad results_branch"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.results_branch }}
          path: res
      - id: m
        env:
          WAVE: ${{ inputs.wave }}
          IMAGE: ${{ inputs.image }}
          MAXP: ${{ inputs.max_parallel }}
          DESIGN: ${{ inputs.design_file }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, json, os, re, sys
          wave, maxp = os.environ["WAVE"], os.environ["MAXP"]
          if not re.fullmatch(r"\d{3}", wave) or not re.fullmatch(r"\d{1,2}", maxp):
              sys.exit("wave must be NNN, max_parallel an integer")
          if not re.fullmatch(r"ghcr\.io/[\w.-]+/satbench-solvers@sha256:[0-9a-f]{64}", os.environ["IMAGE"]):
              sys.exit("image must be ghcr.io/<owner>/satbench-solvers@sha256:<digest>")
          if not re.fullmatch(r"study/[\w.-]+\.toml", os.environ["DESIGN"]):
              sys.exit("design_file must be study/<name>.toml")
          with open(f"res/waves/wave-{wave}.csv") as f:
              jobs = sorted({int(r["job"]) for r in csv.DictReader(f)})
          print("jobs=" + json.dumps(jobs))
          EOF

  run:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    container:
      image: ${{ inputs.image }}
      credentials:  # the image package may be private; the job token can read it
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # CAP_PERFMON: lets the harness count retired instructions/cycles of its own child
      # processes (perf_event_open, user space only). Nothing else is granted.
      options: --cap-add=PERFMON
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        job: ${{ fromJSON(needs.matrix.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.results_branch }}
          path: res
          sparse-checkout: waves
      - name: Run job
        env:
          HOME: /tmp
          JOB: ${{ matrix.job }}
          WAVE: ${{ inputs.wave }}
          DESIGN: ${{ inputs.design_file }}
          # harness code from this commit (recorded as GITHUB_SHA); solver binaries from the image
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          satbench blocks-run --design "$DESIGN" --blocks "res/waves/wave-$WAVE.csv" \
            --jobs "$JOB" --solvers-dir /opt/solvers --instances /tmp/instances \
            --results "out/wave-$WAVE-job-$JOB.jsonl" --logs "out/logs-$JOB"
      - name: Keep solver logs only for unexpected outcomes (artifact size)
        if: always()
        env:
          JOB: ${{ matrix.job }}
          WAVE: ${{ inputs.wave }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: python3 -m satbench.tools.prune_logs "out/wave-$WAVE-job-$JOB.jsonl" "out/logs-$JOB" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-${{ inputs.wave }}-job-${{ matrix.job }}
          path: out/
          retention-days: 90
