# Quick capability probe of GitHub-hosted runners: CPU, topology and hardware counters.
name: probe

on:
  workflow_dispatch:
    inputs:
      image:
        description: "solver image by digest"
        required: true
      count:
        description: "number of parallel probe jobs (fleet sampling), 1-40"
        required: true
        default: "1"

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.m.outputs.ids }}
    steps:
      - id: m
        env:
          COUNT: ${{ inputs.count }}
        run: |
          python3 -c "import os,json,re,sys; c=os.environ['COUNT']; re.fullmatch(r'\d{1,2}',c) and 1<=int(c)<=40 or sys.exit('count 1-40'); print('ids='+json.dumps(list(range(int(c)))))" >> "$GITHUB_OUTPUT"
  probe:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.matrix.outputs.ids) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add=PERFMON
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 -o 'avx512f' /proc/cpuinfo || echo "no avx512f"
          nproc
          cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list
          python - <<'PY'
          from satbench.runner.perfcount import available
          from satbench.runner.batch import physical_cores
          print("physical cores:", physical_cores())
          for i in range(3):
              print("counters:", available())
          PY
