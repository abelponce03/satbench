# Autonomous study execution: every 20 minutes, ingest finished waves into the `results` branch,
# dispatch the next wave of pending blocks, and update results/STATUS.md.
# Pause by setting `enabled = false` in study/orchestrator.toml (running waves still finish).
name: orchestrator

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # push to the results branch
  actions: write    # dispatch blocks.yml, read run artifacts

concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - id: cfg
        run: |
          rb=$(python3 -c "import tomllib; print(tomllib.load(open('main/study/orchestrator.toml','rb')).get('results_branch','results'))")
          [[ "$rb" == "results" || "$rb" == "results-test" ]] || { echo "bad results_branch"; exit 1; }
          echo "branch=$rb" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.branch }}
          path: res
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - name: Install satbench
        working-directory: main
        run: uv sync --frozen --no-dev
      - name: Cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C res config user.name "satbench-orchestrator"
          git -C res config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export PATH="$GITHUB_WORKSPACE/main/.venv/bin:$PATH"
          cd main && python scripts/orchestrate.py --main . --res ../res
